plugins {
    id 'com.android.application'
}
android {
    namespace 'uk.co.newton.assistant'
    compileSdk 35

    defaultConfig {
        applicationId 'uk.co.newton.assistant'
        minSdk 28
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
