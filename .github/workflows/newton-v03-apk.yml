name: Newton v0.3 Android APK
on:
  push:
    branches: [newton-v03-native]
    paths:
      - 'newton/**'
      - '.github/workflows/newton-v03-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build signed debug APK
        working-directory: newton/android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: newton-v03-installable-apk
          path: newton/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
